<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CareerFlow</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <h1 class="brand">CareerFlow</h1>
    <p class="brand-sub">Your personal career management system</p>

    <div class="tab-row">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <div id="auth-error" class="error-msg hidden"></div>

    <form id="login-form" class="auth-form">
      <input type="email" name="email" placeholder="Email" required/>
      <input type="password" name="password" placeholder="Password" required/>
      <button type="submit" class="btn-primary">Login</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" name="name" placeholder="Full Name" required/>
      <input type="email" name="email" placeholder="Email" required/>
      <input type="password" name="password" placeholder="Password (min 6 chars)" required/>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <nav class="sidebar">
    <div class="sidebar-brand">CareerFlow</div>
    <ul class="nav-links">
      <li><a href="#" data-page="dashboard" class="nav-link active">Dashboard</a></li>
      <li><a href="#" data-page="skills" class="nav-link">Skills</a></li>
      <li><a href="#" data-page="goals" class="nav-link">Career Goals</a></li>
      <li><a href="#" data-page="projects" class="nav-link">Projects</a></li>
    </ul>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </nav>

  <main class="main-content">
    <div id="page-dashboard" class="page">
      <h2>Welcome back, <span id="user-name"></span></h2>
      <div class="stats-grid" id="stats-grid"></div>
    </div>

    <div id="page-skills" class="page hidden">
      <div class="page-header">
        <h2>Skills</h2>
        <button class="btn-primary" id="add-skill-btn">+ Add Skill</button>
      </div>
      <div class="filter-row">
        <input type="text" id="skill-search" placeholder="Search skills..." />
        <select id="skill-status-filter">
          <option value="">All statuses</option>
          <option value="learning">Learning</option>
          <option value="completed">Completed</option>
          <option value="paused">Paused</option>
        </select>
      </div>
      <div id="skills-list" class="card-grid"></div>
    </div>

    <div id="page-goals" class="page hidden">
      <div class="page-header">
        <h2>Career Goals</h2>
        <button class="btn-primary" id="add-goal-btn">+ Add Goal</button>
      </div>
      <div class="filter-row">
        <select id="goal-priority-filter">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="goal-completed-filter">
          <option value="">All</option>
          <option value="false">Active</option>
          <option value="true">Completed</option>
        </select>
      </div>
      <div id="goals-list" class="card-grid"></div>
    </div>

    <div id="page-projects" class="page hidden">
      <div class="page-header">
        <h2>Projects</h2>
        <button class="btn-primary" id="add-project-btn">+ Add Project</button>
      </div>
      <div id="projects-list" class="card-grid"></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/skills.js"></script>
<script src="/js/goals.js"></script>
<script src="/js/projects.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
